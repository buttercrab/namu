name: Rust

on:
  push:
    branches:
      - main
  workflow_dispatch: {}
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install latest Rust toolchain
        run: |
          rustup update --no-self-update
          rustup component add clippy
      # Pinned: newer cargo-expand resolves names during expansion, which the macro expansion
      # snapshots (crates/libs/macros/tests/expand) were not generated with.
      - name: Install cargo-expand
        run: |
          cargo install cargo-expand --locked --version 1.0.114
      - name: Prime trybuild target dir
        run: |
          mkdir -p target/tests/target
      - uses: Swatinem/rust-cache@v2
      - name: Check (all targets, all features)
        run: |
          cargo check --workspace --all-targets --all-features
      - name: Clippy (deny warnings)
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test (all targets, all features)
        run: |
          cargo test --workspace --all-targets --all-features
      - name: Doc (no deps)
        run: |
          cargo doc --workspace --all-features --no-deps

  e2e:
    name: E2E (distributed runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and Redis
        run: |
          rustup update --no-self-update
          rustup target add wasm32-wasip2
          sudo apt-get update && sudo apt-get install -y redis-server
          sudo systemctl stop redis-server || true
      - uses: Swatinem/rust-cache@v2
      - name: Run e2e
        run: ./scripts/e2e.sh
      - name: Cluster logs
        if: failure() || cancelled()
        run: tail -n 40 data/e2e/*.log data/e2e/*/logs/*.log

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install latest Rust toolchain
        run: |
          rustup update --no-self-update
          rustup toolchain install nightly
          rustup component add rustfmt --toolchain nightly
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: |
          cargo +nightly fmt --all --check

  security:
    name: Security (deny + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install latest Rust toolchain
        run: |
          rustup update --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: |
          cargo install cargo-deny --locked
      - name: Install cargo-audit
        run: |
          cargo install cargo-audit --locked
      - name: Cargo deny
        run: |
          cargo deny check --deny warnings
      - name: Cargo audit
        run: |
          cargo audit --deny warnings
