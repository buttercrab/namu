[package]
name = "namu-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Logs, metrics and traces for NAMU's orchestrator and workers"

[dependencies]
anyhow = { workspace = true }
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
namu-engine = { path = "../engine", version = "0.1.0", features = ["otel"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

[dev-dependencies]
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
namu-core = { path = "../core", version = "0.1.0" }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "testing"] }
tokio = { workspace = true }
