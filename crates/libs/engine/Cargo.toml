[package]
name = "namu-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The NAMU engine: workers that drive workflow IR, with handoffs, scopes and recovery"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
metrics = "0.24"
namu-core = { path = "../core", version = "0.1.0" }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"], optional = true }
serde = { workspace = true, features = ["rc"] }
rcgen = { version = "0.14", optional = true }
rmp-serde = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_bytes = "0.11"
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-opentelemetry = { version = "0.34", default-features = false, optional = true }
uuid = { version = "1.17", features = ["v4", "serde"] }

[features]
# A cluster CA and members' certificates, for development and tests (`namu certs`).
certs = ["dep:rcgen"]
# A run is one OpenTelemetry trace across workers (see `telemetry`).
otel = ["dep:opentelemetry", "dep:tracing-opentelemetry"]

[dev-dependencies]
rcgen = "0.14"
