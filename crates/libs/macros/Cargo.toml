[package]
name = "namu-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The #[task], #[workflow] and Data macros of NAMU"

[lib]
proc-macro = true

[dependencies]
darling = { workspace = true }
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = [
  "full",
  "visit-mut",
  "visit",
  "extra-traits",
] }

[dev-dependencies]
anyhow = "1"
macrotest = "1.1.0"
