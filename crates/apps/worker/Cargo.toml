[package]
name = "namu-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A NAMU worker: runs the engine on the mesh and serves WASM, native and Python tasks"

[[bin]]
name = "namu-worker"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = "0.3"
libloading = "0.8"
namu-core = { path = "../../libs/core", version = "0.1.0" }
namu-engine = { path = "../../libs/engine", version = "0.1.0" }
metrics = "0.24"
namu-proto = { path = "../../libs/proto", version = "0.1.0" }
namu-telemetry = { path = "../../libs/telemetry", version = "0.1.0" }
redis = { version = "1.0", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
rmp-serde = { workspace = true }
serde_bytes = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true }
sha2 = "0.10"
tar = "0.4"
tokio = { workspace = true }
tracing = "0.1"
uuid = { version = "1.17", features = ["v4", "serde"] }
wasmtime = "50.0.1"
wasmtime-wasi = { version = "49.0.5", default-features = false, features = ["p2"] }
zstd = "0.13.4"
