[package]
name = "namu-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The NAMU command line: build task artifacts, publish workflows, and start runs"

[[bin]]
name = "namu"
path = "src/main.rs"
# Shares its name with the `namu` library, whose docs are the ones to build.
doc = false

[dependencies]
anyhow = { workspace = true }
cargo_metadata = "0.19"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
getrandom = "0.4"
libloading = "0.8"
namu-core = { path = "../../libs/core", version = "0.1.0" }
namu-engine = { path = "../../libs/engine", version = "0.1.0", features = ["certs"] }
namu-proto = { path = "../../libs/proto", version = "0.1.0" }
rmp-serde = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["multipart", "json", "http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tar = "0.4"
tokio = { workspace = true }
toml = "0.8"
toml_edit = "0.24"
walkdir = "2.5"
zstd = "0.14.3"
