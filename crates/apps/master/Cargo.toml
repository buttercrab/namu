[package]
name = "namu-master"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The NAMU orchestrator: task and workflow registry, membership, and runs"

[[bin]]
name = "namu-master"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { version = "0.8", features = ["multipart"] }
axum-server = { version = "0.9", default-features = false, features = ["tls-rustls-no-provider"] }
bytes = "1.10"
namu-core = { path = "../../libs/core", version = "0.1.0" }
metrics = "0.24"
namu-engine = { path = "../../libs/engine", version = "0.1.0", features = ["otel"] }
namu-proto = { path = "../../libs/proto", version = "0.1.0" }
namu-telemetry = { path = "../../libs/telemetry", version = "0.1.0" }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
object_store = { version = "0.14", default-features = false, features = ["fs", "aws-base", "reqwest", "ring"] }
rmp-serde = { workspace = true }
# The HTTP client object_store reaches S3 with; TLS by the process's provider (ring).
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-no-provider"] }
redis = { version = "1.0", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tar = "0.4"
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
url = "2"
uuid = { version = "1.17", features = ["v4", "serde"] }
zstd = "0.14.3"

[dev-dependencies]
namu = { path = "../../.." }
