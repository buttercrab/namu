[workspace]
exclude = [
  "tasks/*",
  "pipelines/*",
  "tests/e2e/tasks/*",
  "examples/distributed/tasks/*",
  "examples/rag/tasks/*",
  "examples/rag/model",
  "examples/rag/query",
]
members = [
  "crates/apps/cli",
  "crates/apps/master",
  "crates/apps/worker",
  "crates/libs/core",
  "crates/libs/engine",
  "crates/libs/flow",
  "crates/libs/guest",
  "crates/libs/macros",
  "crates/libs/proto",

  "examples/advanced",
  "examples/basic",
  "examples/rag/workflows",
  "examples/distributed/workflows",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1.10"
darling = "0.24"
inventory = "0.3"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49", features = ["full"] }

[package]
name = "namu"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = { workspace = true }
inventory = { workspace = true }
namu-core = { path = "crates/libs/core", version = "0.1.0" }
namu-flow = { path = "crates/libs/flow", version = "0.1.0" }
namu-macros = { path = "crates/libs/macros", version = "0.1.0" }
serde_json = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
namu-engine = { path = "crates/libs/engine", version = "0.1.0" }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = "0.3.20"
trybuild = "1.0.105"

[[bench]]
name = "engine"
harness = false
