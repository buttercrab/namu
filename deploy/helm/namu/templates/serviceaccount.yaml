apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "namu.orchestrator" . }}
  labels: {{- include "namu.labels" . | nindent 4 }}
  {{- with .Values.orchestrator.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "namu.fullname" . }}-worker
  labels: {{- include "namu.labels" . | nindent 4 }}
