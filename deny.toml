[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  # rustls's stack (ring, rustls-webpki, untrusted) and subtle: permissive, OSI-approved.
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow = []
deny = []
# ring, under rustls, pins these; everything else uses newer ones.
skip = [
  { crate = "getrandom@0.2.17", reason = "ring 0.17 depends on getrandom 0.2" },
  { crate = "windows-sys@0.52.0", reason = "ring 0.17 depends on windows-sys 0.52" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
